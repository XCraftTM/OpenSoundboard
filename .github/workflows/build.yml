name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build every supported Minecraft version
        run: ./gradlew buildAllJars --stacktrace

      - name: Upload release jars
        uses: actions/upload-artifact@v4
        with:
          name: opensoundboard-jars
          path: build/jars/*.jar
          if-no-files-found: error
