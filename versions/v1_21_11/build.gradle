plugins {
    id 'fabric-loom'
    id 'maven-publish'
}

group = project.maven_group
version = project.mod_version + "+mc1.21.11"

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    implementation "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    modRuntimeOnly "maven.modrinth:simple-voice-chat:fabric-${project.voicechat_version}"

    // For 1.21.11, owo is published on Modrinth maven under group maven.modrinth
    modImplementation "maven.modrinth:owo-lib:${project.owo_version}"

    // owo-lib runtime deps (pinned to what owo-lib expects)
    modImplementation "io.wispforest:endec:${project.endec_version}"
    modImplementation "io.wispforest.endec:netty:${project.endec_netty_version}"
    modImplementation "io.wispforest.endec:gson:${project.endec_gson_version}"
    modImplementation "io.wispforest.endec:jankson:${project.endec_jankson_version}"
    // owo also uses Jankson at runtime
    modImplementation 'blue.endless:jankson:1.2.3'

    api project(':common')
}

// Pull shared resources from :common (assets/, lang, etc.)
sourceSets {
    main {
        java {
            srcDir project(':common-mc').file('src/main/java')
        }
        resources {
            // keep this module's own resources (fabric.mod.json, etc.)
            srcDir 'src/main/resources'

            // plus shared resources from :common
            srcDir project(':common').file('src/main/resources')

            // exclude placeholder mod metadata from :common
            exclude('fabric.mod.json')
        }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "fabric_version", project.fabric_version
    inputs.property "modmenu_version", project.modmenu_version
    inputs.property "voicechat_api_version", project.voicechat_api_version
    inputs.property "voicechat_version", project.voicechat_version
    inputs.property "owo_version", project.owo_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "fabric_version": project.fabric_version,
                "modmenu_version": project.modmenu_version,
                "voicechat_api_version": project.voicechat_api_version,
                "voicechat_version": project.voicechat_version,
                "owo_version": project.owo_version
    }

    // Explicitly include this module's fabric.mod.json - some Loom setups mark the output as not-a-mod otherwise
    from("src/main/resources") {
        include "fabric.mod.json"
    }
}

// Let Loom handle jar contents; don't override jar with sourceSets output directly
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    withSourcesJar()
}
