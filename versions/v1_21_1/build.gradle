plugins {
    id 'fabric-loom'
    id 'maven-publish'
}

group = project.maven_group
version = project.mod_version + "+mc1.21.1"

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    implementation "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    modRuntimeOnly "maven.modrinth:simple-voice-chat:fabric-${project.voicechat_version}"
    modImplementation "io.wispforest:owo-lib:${project.owo_version}"
    modRuntimeOnly "maven.modrinth:owo-lib:${project.owo_version}"
    include "io.wispforest:owo-sentinel:${project.owo_version}"

    api project(':common')
}

sourceSets {
    main {
        java {
            srcDir project(':common-mc').file('src/main/java')
            srcDir project(':common-mc').file('src/mc-yarn/java')
        }
        resources {
            srcDir project(':common').file('src/main/resources')
            exclude('fabric.mod.json')
        }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "fabric_version", project.fabric_version
    inputs.property "modmenu_version", project.modmenu_version
    inputs.property "voicechat_api_version", project.voicechat_api_version
    inputs.property "voicechat_version", project.voicechat_version
    inputs.property "owo_version", project.owo_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "fabric_version": project.fabric_version,
                "modmenu_version": project.modmenu_version,
                "voicechat_api_version": project.voicechat_api_version,
                "voicechat_version": project.voicechat_version,
                "owo_version": project.owo_version
    }

    // Explicitly include this module's fabric.mod.json (excluded globally by sourceSets to avoid common's copy)
    from("src/main/resources") {
        include "fabric.mod.json"
    }
}

jar {
    from(project(':common').sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}
