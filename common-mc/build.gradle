plugins {
    id 'java-library'
    id 'fabric-loom'
}

// Default compile target for shared MC-facing code
// Version modules can still override at runtime
loom {
    // no special config
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def baselineMinecraftVersion = project.findProperty('baseline_minecraft_version') ?: project.rootProject.findProperty('baseline_minecraft_version') ?: '1.21.11'
def baselineYarnMappings = project.findProperty('baseline_yarn_mappings') ?: project.rootProject.findProperty('baseline_yarn_mappings') ?: '1.21.11+build.4'

dependencies {
    api project(':common')

    minecraft "com.mojang:minecraft:${baselineMinecraftVersion}"
    mappings "net.fabricmc:yarn:${baselineYarnMappings}:v2"

    // needed for FabricLoader references
    modImplementation "net.fabricmc:fabric-loader:0.18.4"

    // voicechat api referenced from these classes
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.0'
}
