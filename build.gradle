plugins {
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// Root project is an aggregator; don't assume Java plugin is applied
plugins.withId('java') {
    sourceSets {
        main {
            java {
                srcDirs = []
            }
        }
    }
}

allprojects {
    repositories {
        // required for gson, lombok, and many other libs
        mavenCentral()

        // fabric maven hosts loader, yarn etc.
        maven { url 'https://maven.fabricmc.net/' }

        maven { url "https://maven.terraformersmc.com/" }
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup("maven.modrinth")
            }
        }
        maven { url 'https://maven.maxhenkel.de/repository/public' }
        maven { url "https://maven.shedaniel.me/" }
        maven { url 'https://maven.wispforest.io/releases/' }
        maven { url 'https://jitpack.io' }
    }
}

subprojects {
    // Keep Java toolchain consistent
    plugins.withType(JavaPlugin) {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
    }
}

// Aggregate build for all versions
tasks.register('buildAllVersions') {
    group = 'build'
    description = 'Builds remapped jars for all supported Minecraft versions'

    dependsOn(
            ':versions:v1_21_11:build',
            ':versions:v1_21_10:build',
            ':versions:v1_21_8:build',
            ':versions:v1_21_5:build',
            ':versions:v1_21_4:build',
            ':versions:v1_21_1:build'
    )
}

// Collect all version JARs into build/jars/
tasks.register('collectJars', Copy) {
    group = 'build'
    description = 'Copies all version JARs into build/jars/'

    dependsOn('buildAllVersions')

    from(project(':versions:v1_21_11').layout.buildDirectory.dir('libs'))
    from(project(':versions:v1_21_10').layout.buildDirectory.dir('libs'))
    from(project(':versions:v1_21_8').layout.buildDirectory.dir('libs'))
    from(project(':versions:v1_21_5').layout.buildDirectory.dir('libs'))
    from(project(':versions:v1_21_4').layout.buildDirectory.dir('libs'))
    from(project(':versions:v1_21_1').layout.buildDirectory.dir('libs'))

    include('*.jar')
    exclude('*-sources.jar')

    into(layout.buildDirectory.dir('jars'))
}
