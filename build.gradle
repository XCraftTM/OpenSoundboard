plugins {
    id 'maven-publish'
    id 'com.modrinth.minotaur' apply false
}

// Load .env file if present (for MODRINTH_TOKEN, etc.)
file('.env').with { envFile ->
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
                def (key, value) = trimmed.split('=', 2)
                if (!System.getenv(key.trim())) {
                    ext.set(key.trim(), value.trim())
                }
            }
        }
    }
}

version = project.mod_version
group = project.maven_group

// Root project is an aggregator; don't assume Java plugin is applied
plugins.withId('java') {
    sourceSets {
        main {
            java {
                srcDirs = []
            }
        }
    }
}

allprojects {
    repositories {
        // required for gson, lombok, and many other libs
        mavenCentral()

        // fabric maven hosts loader, yarn etc.
        maven { url 'https://maven.fabricmc.net/' }

        maven { url "https://maven.terraformersmc.com/" }
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup("maven.modrinth")
            }
        }
        maven { url 'https://maven.maxhenkel.de/repository/public' }
        maven { url "https://maven.shedaniel.me/" }
        maven { url 'https://maven.wispforest.io/releases/' }
        maven { url 'https://jitpack.io' }
    }
}

subprojects {
    // Keep Java toolchain consistent
    plugins.withType(JavaPlugin) {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
    }
}

// Aggregate build for all versions
tasks.register('buildAllVersions') {
    group = 'build'
    description = 'Builds remapped jars for all supported Minecraft versions'

    dependsOn(
            ':versions:v1_21_11:build',
            ':versions:v1_21_10:build',
            ':versions:v1_21_8:build',
            ':versions:v1_21_5:build',
            ':versions:v1_21_4:build',
            ':versions:v1_21_1:build'
    )
}

// ---------------------------------------------------------------------------
// Modrinth publishing (minotaur) — configure each version subproject
// ---------------------------------------------------------------------------
def versionProjects = subprojects.findAll { it.path.startsWith(':versions:') }

versionProjects.each { versionProj ->
    versionProj.plugins.apply('com.modrinth.minotaur')

    versionProj.afterEvaluate {
        versionProj.modrinth {
            token = System.getenv('MODRINTH_TOKEN') ?: (rootProject.ext.has('MODRINTH_TOKEN') ? rootProject.ext.get('MODRINTH_TOKEN') : '')
            projectId = rootProject.property('modrinth_project_id')
            versionNumber = versionProj.version.toString()
            versionName = "OpenSoundboard ${versionProj.version}"
            versionType = rootProject.findProperty('releaseType') ?: 'release'
            changelog = rootProject.findProperty('changelog') ?: ''

            uploadFile = versionProj.tasks.named('remapJar')

            // Game versions: use per-module override if present, otherwise the single minecraft_version
            def gameVers = versionProj.findProperty('modrinth_game_versions')
            if (gameVers) {
                gameVersions = gameVers.toString().split(',').collect { it.trim() }
            } else {
                gameVersions = [versionProj.property('minecraft_version').toString()]
            }

            loaders = ['fabric']

            dependencies {
                required.project 'fabric-api'
                required.project 'simple-voice-chat'
                required.project 'owo-lib'
                optional.project 'modmenu'
            }
        }
    }
}

// Aggregate task to publish all versions at once
tasks.register('publishToModrinth') {
    group = 'publishing'
    description = 'Publishes all version JARs to Modrinth'

    dependsOn versionProjects.collect { ":${it.path.substring(1)}:modrinth" }
}

// Collect all version JARs into build/jars/
tasks.register('collectJars', Copy) {
    group = 'build'
    description = 'Copies all version JARs into build/jars/'

    dependsOn('buildAllVersions')

    from(project(':versions:v1_21_11').layout.buildDirectory.dir('libs'))
    from(project(':versions:v1_21_10').layout.buildDirectory.dir('libs'))
    from(project(':versions:v1_21_8').layout.buildDirectory.dir('libs'))
    from(project(':versions:v1_21_5').layout.buildDirectory.dir('libs'))
    from(project(':versions:v1_21_4').layout.buildDirectory.dir('libs'))
    from(project(':versions:v1_21_1').layout.buildDirectory.dir('libs'))

    include('*.jar')
    exclude('*-sources.jar')

    into(layout.buildDirectory.dir('jars'))
}
